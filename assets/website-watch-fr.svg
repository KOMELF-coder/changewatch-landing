<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650"><rect width="480" height="650" rx="24" fill="#102645"/><g font-family="Arial,sans-serif"><rect x="20" y="24" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="49" fill="#102645" font-size="23" font-weight="700">1. Question commerciale</text><text x="36" y="71" fill="#334b62" font-size="15">Quel changement pourrait éclairer ma décision ?</text><path d="M240 90v14m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="106" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="131" fill="#102645" font-size="23" font-weight="700">2. Page sélectionnée</text><text x="36" y="153" fill="#334b62" font-size="15">Une URL publique et une information utile</text><path d="M240 172v14m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="188" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="213" fill="#102645" font-size="23" font-weight="700">3. Contrôle programmé</text><text x="36" y="235" fill="#334b62" font-size="15">Selon la compatibilité et le rythme retenu</text><path d="M240 254v14m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="270" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="295" fill="#102645" font-size="23" font-weight="700">4. Changement détecté</text><text x="36" y="317" fill="#334b62" font-size="15">Un signal, pas une conclusion stratégique</text><path d="M240 336v14m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="352" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="377" fill="#102645" font-size="23" font-weight="700">5. Alerte email</text><text x="36" y="399" fill="#334b62" font-size="15">La personne responsable reçoit le signal</text><path d="M240 418v14m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="434" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="459" fill="#102645" font-size="23" font-weight="700">6. Vérification humaine</text><text x="36" y="481" fill="#334b62" font-size="15">Source, contexte et portée du changement</text><path d="M240 500v14m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="516" width="440" height="64" rx="12" fill="#dbf5ee"/><text x="36" y="541" fill="#102645" font-size="23" font-weight="700">7. Décision consignée</text><text x="36" y="563" fill="#334b62" font-size="15">Action ou absence d’action motivée</text></g></svg>