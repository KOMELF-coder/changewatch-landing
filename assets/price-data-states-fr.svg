<svg xmlns="http://www.w3.org/2000/svg" width="440" height="630" viewBox="0 0 440 630"><rect width="440" height="630" rx="14" fill="#102645"/><g font-family="Arial,sans-serif"><text x="28" y="48" fill="#b5f2ce" font-size="13">CHANGEWATCH / GUIDE</text><text x="28" y="88" fill="white" font-size="27" font-weight="700">Lire les trois états</text><text x="28" y="119" fill="#d9e4f5" font-size="17">Une grille pour qualifier la donnée</text><rect x="20" y="150" width="400" height="127" rx="8" fill="#f4f7fc"/><text x="38" y="181" fill="#244bd6" font-size="14" font-weight="700">01</text><text x="72" y="182" fill="#102645" font-size="21" font-weight="700">Relu et identique</text><text x="38" y="218" fill="#102645" font-size="18">Lecture récente réussie.</text><text x="38" y="249" fill="#102645" font-size="18">Même valeur, même variante.</text><rect x="20" y="293" width="400" height="127" rx="8" fill="#f4f7fc"/><text x="38" y="324" fill="#244bd6" font-size="14" font-weight="700">02</text><text x="72" y="325" fill="#102645" font-size="21" font-weight="700">Changement confirmé</text><text x="38" y="361" fill="#102645" font-size="18">Deux observations comparables.</text><text x="38" y="392" fill="#102645" font-size="18">Vérifier la source avant d’agir.</text><rect x="20" y="436" width="400" height="127" rx="8" fill="#f4f7fc"/><text x="38" y="467" fill="#244bd6" font-size="14" font-weight="700">03</text><text x="72" y="468" fill="#102645" font-size="21" font-weight="700">État inconnu</text><text x="38" y="504" fill="#102645" font-size="18">La collecte a échoué.</text><text x="38" y="535" fill="#102645" font-size="18">Ne pas conclure à la stabilité.</text></g></svg>