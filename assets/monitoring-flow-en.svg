<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">From monitoring to decisions</title><desc id="desc">A compatible page is checked at the plan frequency. A confirmed significant change triggers an email. Review the source and context before deciding.</desc><rect width="960" height="560" fill="#edf2f7"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="57" fill="#244bd6" font-size="16" letter-spacing="2">HOW CHANGEWATCH WORKS</text><text x="48" y="98" fill="#102645" font-size="28" font-weight="600">Automate the checks. Keep the judgement.</text><path d="M450 223h60M734 310v35M510 431h-60" fill="none" stroke="#244bd6" stroke-width="3"/><g fill="#fff" stroke="#c6d3e1"><rect x="48" y="145" width="402" height="165" rx="10"/><rect x="510" y="145" width="402" height="165" rx="10"/><rect x="510" y="345" width="402" height="165" rx="10"/></g><rect x="48" y="345" width="402" height="165" rx="10" fill="#102645"/><g fill="#244bd6" font-size="17" font-weight="600"><text x="74" y="180">01 / SELECT</text><text x="536" y="180">02 / COMPARE</text><text x="536" y="380">03 / RECEIVE</text></g><g fill="#102645" font-size="24" font-weight="600"><text x="74" y="221">A compatible page</text><text x="536" y="221">Scheduled checks</text><text x="536" y="421">An email alert</text></g><g fill="#526175" font-size="18"><text x="74" y="257">Scope and extraction checked</text><text x="74" y="282">during setup.</text><text x="536" y="257">At your plan’s frequency,</text><text x="536" y="282">not in real time.</text><text x="536" y="457">When a significant change</text><text x="536" y="482">is confirmed, with its source.</text></g><text x="74" y="380" fill="#b5f2ce" font-size="17" font-weight="600">04 / DECIDE</text><text x="74" y="421" fill="#fff" font-size="24" font-weight="600">Your business judgement</text><text x="74" y="457" fill="#c5d6ea" font-size="18">Check the context and choose</text><text x="74" y="482" fill="#c5d6ea" font-size="18">the right next step.</text></g></svg>
