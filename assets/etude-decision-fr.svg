<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600"><rect width="440" height="600" rx="18" fill="#102645"/><g font-family="Arial,sans-serif"><text x="24" y="38" font-size="12" fill="#73f1e1">ÉTUDE DE CONCURRENCE / CAS FICTIF</text><text x="24" y="76" font-size="26" font-weight="700" fill="white">De la preuve au choix</text><rect x="20" y="106" width="400" height="130" rx="10" fill="#f3f6fc"/><text x="36" y="139" font-size="21" fill="#102645" font-weight="700">01 · Observation</text><text x="36" y="174" font-size="18" fill="#102645">Tableau de tailles générique.</text><text x="36" y="201" font-size="18" fill="#102645">Promesse : choisir facilement.</text><rect x="20" y="265" width="400" height="130" rx="10" fill="#f3f6fc"/><text x="36" y="298" font-size="21" fill="#102645" font-weight="700">02 · Hypothèse</text><text x="36" y="333" font-size="18" fill="#102645">Des clients hésitent sur la taille.</text><text x="36" y="360" font-size="18" fill="#102645">À confronter à leurs questions.</text><rect x="20" y="424" width="400" height="130" rx="10" fill="#f3f6fc"/><text x="36" y="457" font-size="21" fill="#102645" font-weight="700">03 · Décision à vérifier</text><text x="36" y="492" font-size="18" fill="#102645">Ajouter les mesures par modèle.</text><text x="36" y="519" font-size="18" fill="#102645">Évaluer leur compréhension.</text></g></svg>