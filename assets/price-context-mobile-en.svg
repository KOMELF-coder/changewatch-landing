<svg xmlns="http://www.w3.org/2000/svg" width="400" height="650" viewBox="0 0 400 650" role="img" aria-labelledby="t d"><title id="t">One price, three questions</title><desc id="d">Fictional example: 99 euros becomes 79 euros. Check the variant, promotion and delivery.</desc><rect width="400" height="650" fill="#102645"/><g font-family="Segoe UI, Arial, sans-serif"><text x="24" y="40" fill="#b5f2ce" font-size="14" letter-spacing="1">PUT THE PRICE IN CONTEXT</text><text x="24" y="69" fill="#c5d6ea" font-size="15">Fictional example · Atelier bag</text><rect x="24" y="94" width="352" height="175" rx="10" fill="#f5f8fb"/><path d="M64 146v-14c0-26 40-26 40 0v14" fill="none" stroke="#8da4bd" stroke-width="8"/><path d="M50 145h68l12 67H38Z" fill="#c4d4e4"/><text x="159" y="159" fill="#596b80" font-size="26">99 €</text><path d="M156 149h65" stroke="#596b80" stroke-width="2"/><text x="159" y="205" fill="#102645" font-size="38" font-weight="600">79 €</text><text x="159" y="241" fill="#244bd6" font-size="15">−€20 / −20.2%</text><g fill="#fff" font-size="21"><text x="24" y="321">01 / Same variant?</text><text x="24" y="434">02 / Which conditions?</text><text x="24" y="547">03 / Total delivered cost?</text></g><g fill="#c5d6ea" font-size="17"><text x="24" y="353">Colour, size, quantity.</text><text x="24" y="466">Code, dates, eligibility.</text><text x="24" y="579">Fees and order threshold.</text></g><g stroke="#47617f"><path d="M24 387h352"/><path d="M24 500h352"/></g></g></svg>
