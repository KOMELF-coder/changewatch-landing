<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600"><rect width="440" height="600" rx="24" fill="#102645"/><g font-family="Arial,sans-serif"><text x="24" y="42" fill="#c8d7ff" font-size="15" font-weight="700">DU SIGNAL À LA DÉCISION</text><rect x="20" y="70" width="400" height="145" rx="14" fill="#f5f8ff"/><text x="38" y="98" fill="#2445b6" font-size="13" font-weight="700">01 / OBSERVER</text><text x="38" y="131" fill="#102645" font-size="22" font-weight="700">54 € → 49 €</text><text x="38" y="161" fill="#33445c" font-size="16">Même gourde G60 verte, 600 ml</text><text x="38" y="185" fill="#33445c" font-size="16">Exemple fictif : J1 → J3</text><rect x="20" y="237" width="400" height="145" rx="14" fill="#f5f8ff"/><text x="38" y="265" fill="#2445b6" font-size="13" font-weight="700">02 / QUALIFIER</text><text x="38" y="298" fill="#102645" font-size="22" font-weight="700">58 € → 53 € livré</text><text x="38" y="328" fill="#33445c" font-size="16">4 € de livraison dans les deux cas</text><text x="38" y="352" fill="#33445c" font-size="16">Vérifier variante et conditions</text><rect x="20" y="404" width="400" height="145" rx="14" fill="#f5f8ff"/><text x="38" y="432" fill="#2445b6" font-size="13" font-weight="700">03 / DÉCIDER</text><text x="38" y="465" fill="#102645" font-size="22" font-weight="700">Documenter, puis agir</text><text x="38" y="495" fill="#33445c" font-size="16">Relire la source et le contexte</text><text x="38" y="519" fill="#33445c" font-size="16">Aucun alignement automatique</text></g></svg>