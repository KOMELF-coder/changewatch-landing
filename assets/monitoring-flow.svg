<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Du suivi à la décision</title><desc id="desc">Une page compatible est vérifiée selon le forfait. Un changement important confirmé déclenche une alerte email. La source et le contexte sont examinés avant une décision.</desc><rect width="960" height="560" fill="#edf2f7"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="57" fill="#244bd6" font-size="16" letter-spacing="2">LE PARCOURS CHANGEWATCH</text><text x="48" y="98" fill="#102645" font-size="28" font-weight="600">Automatiser les vérifications. Garder l’analyse.</text><path d="M450 223h60M734 310v35M510 431h-60" fill="none" stroke="#244bd6" stroke-width="3"/><g fill="#fff" stroke="#c6d3e1"><rect x="48" y="145" width="402" height="165" rx="10"/><rect x="510" y="145" width="402" height="165" rx="10"/><rect x="510" y="345" width="402" height="165" rx="10"/></g><rect x="48" y="345" width="402" height="165" rx="10" fill="#102645"/><g fill="#244bd6" font-size="17" font-weight="600"><text x="74" y="180">01 / SÉLECTIONNER</text><text x="536" y="180">02 / COMPARER</text><text x="536" y="380">03 / RECEVOIR</text></g><g fill="#102645" font-size="24" font-weight="600"><text x="74" y="221">Une page compatible</text><text x="536" y="221">Des vérifications planifiées</text><text x="536" y="421">Une alerte email</text></g><g fill="#526175" font-size="18"><text x="74" y="257">Périmètre et extraction vérifiés</text><text x="74" y="282">à la configuration.</text><text x="536" y="257">Selon la fréquence du forfait,</text><text x="536" y="282">sans surveillance en temps réel.</text><text x="536" y="457">Lorsqu’un changement important</text><text x="536" y="482">est confirmé, avec sa source.</text></g><text x="74" y="380" fill="#b5f2ce" font-size="17" font-weight="600">04 / DÉCIDER</text><text x="74" y="421" fill="#fff" font-size="24" font-weight="600">Votre regard métier</text><text x="74" y="457" fill="#c5d6ea" font-size="18">Vérifier le contexte et choisir</text><text x="74" y="482" fill="#c5d6ea" font-size="18">la suite pertinente.</text></g></svg>
