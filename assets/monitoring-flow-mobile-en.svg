<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="t d"><title id="t">From monitoring to decisions</title><desc id="d">Choose a compatible page, compare, receive an alert and check the source before deciding.</desc><rect width="400" height="800" fill="#edf2f7"/><g font-family="Segoe UI, Arial, sans-serif"><text x="24" y="39" fill="#244bd6" font-size="14" letter-spacing="1">HOW CHANGEWATCH WORKS</text><text x="24" y="75" fill="#102645" font-size="24" font-weight="600">From monitoring to decisions.</text><path d="M200 255v20M200 425v20M200 595v20" stroke="#244bd6" stroke-width="3"/><g fill="#fff" stroke="#c6d3e1"><rect x="24" y="105" width="352" height="150" rx="8"/><rect x="24" y="275" width="352" height="150" rx="8"/><rect x="24" y="445" width="352" height="150" rx="8"/></g><rect x="24" y="615" width="352" height="150" rx="8" fill="#102645"/><g fill="#244bd6" font-size="14" font-weight="600"><text x="44" y="133">01 / SELECT</text><text x="44" y="303">02 / COMPARE</text><text x="44" y="473">03 / RECEIVE</text></g><g fill="#102645" font-size="21" font-weight="600"><text x="44" y="169">A compatible page</text><text x="44" y="339">Scheduled checks</text><text x="44" y="509">An email alert</text></g><g fill="#526175" font-size="16"><text x="44" y="201">Scope and extraction checked</text><text x="44" y="226">during setup.</text><text x="44" y="371">At your plan’s frequency,</text><text x="44" y="396">not in real time.</text><text x="44" y="541">When a significant change</text><text x="44" y="566">is confirmed, with its source.</text></g><text x="44" y="643" fill="#b5f2ce" font-size="14" font-weight="600">04 / DECIDE</text><text x="44" y="679" fill="#fff" font-size="21" font-weight="600">Your business judgement</text><text x="44" y="711" fill="#c5d6ea" font-size="16">Check the context and choose</text><text x="44" y="736" fill="#c5d6ea" font-size="16">the right next step.</text></g></svg>
