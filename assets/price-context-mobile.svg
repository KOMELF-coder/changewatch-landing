<svg xmlns="http://www.w3.org/2000/svg" width="400" height="650" viewBox="0 0 400 650" role="img" aria-labelledby="t d"><title id="t">Un prix, trois questions</title><desc id="d">Exemple fictif : 99 euros devient 79 euros. Vérifier la variante, la promotion et la livraison.</desc><rect width="400" height="650" fill="#102645"/><g font-family="Segoe UI, Arial, sans-serif"><text x="24" y="40" fill="#b5f2ce" font-size="14" letter-spacing="1">LE PRIX DANS SON CONTEXTE</text><text x="24" y="69" fill="#c5d6ea" font-size="15">Exemple fictif · Sac Atelier</text><rect x="24" y="94" width="352" height="175" rx="10" fill="#f5f8fb"/><path d="M64 146v-14c0-26 40-26 40 0v14" fill="none" stroke="#8da4bd" stroke-width="8"/><path d="M50 145h68l12 67H38Z" fill="#c4d4e4"/><text x="159" y="159" fill="#596b80" font-size="26">99 €</text><path d="M156 149h65" stroke="#596b80" stroke-width="2"/><text x="159" y="205" fill="#102645" font-size="38" font-weight="600">79 €</text><text x="159" y="241" fill="#244bd6" font-size="15">−20 € / −20,2 %</text><g fill="#fff" font-size="21"><text x="24" y="321">01 / Même variante ?</text><text x="24" y="434">02 / Quelles conditions ?</text><text x="24" y="547">03 / Quel coût livré ?</text></g><g fill="#c5d6ea" font-size="17"><text x="24" y="353">Couleur, format, quantité.</text><text x="24" y="466">Code, durée, offre réservée.</text><text x="24" y="579">Frais et seuil de panier.</text></g><g stroke="#47617f"><path d="M24 387h352"/><path d="M24 500h352"/></g></g></svg>
