<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650"><rect width="480" height="650" rx="24" fill="#102645"/><g font-family="Arial,sans-serif"><rect x="20" y="24" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="49" fill="#102645" font-size="23" font-weight="700">1. Retail page</text><text x="36" y="71" fill="#334b62" font-size="15">A known public offer and its source URL</text><path d="M240 90v26m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="118" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="143" fill="#102645" font-size="23" font-weight="700">2. Product and variant</text><text x="36" y="165" fill="#334b62" font-size="15">Confirm model, seller and quantity</text><path d="M240 184v26m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="212" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="237" fill="#102645" font-size="23" font-weight="700">3. Price and conditions</text><text x="36" y="259" fill="#334b62" font-size="15">Eligibility, stock, tax and delivery context</text><path d="M240 278v26m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="306" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="331" fill="#102645" font-size="23" font-weight="700">4. Scheduled monitoring</text><text x="36" y="353" fill="#334b62" font-size="15">Compatible information, within known limits</text><path d="M240 372v26m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="400" width="440" height="64" rx="12" fill="#ffffff"/><text x="36" y="425" fill="#102645" font-size="23" font-weight="700">5. Email alert</text><text x="36" y="447" fill="#334b62" font-size="15">A detected change needs review</text><path d="M240 466v26m-4 -5l4 5 4-5" stroke="#7ce8cf" stroke-width="2" fill="none"/><rect x="20" y="494" width="440" height="64" rx="12" fill="#dbf5ee"/><text x="36" y="519" fill="#102645" font-size="23" font-weight="700">6. Human review</text><text x="36" y="541" fill="#334b62" font-size="15">Recheck the offer before comparing</text></g></svg>