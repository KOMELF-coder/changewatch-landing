<svg xmlns="http://www.w3.org/2000/svg" width="440" height="630" viewBox="0 0 440 630"><rect width="440" height="630" rx="14" fill="#102645"/><g font-family="Arial,sans-serif"><text x="28" y="48" fill="#b5f2ce" font-size="13">CHANGEWATCH / GUIDE</text><text x="28" y="88" fill="white" font-size="27" font-weight="700">Read all three states</text><text x="28" y="119" fill="#d9e4f5" font-size="17">A framework for evaluating data</text><rect x="20" y="150" width="400" height="127" rx="8" fill="#f4f7fc"/><text x="38" y="181" fill="#244bd6" font-size="14" font-weight="700">01</text><text x="72" y="182" fill="#102645" font-size="21" font-weight="700">Reread and unchanged</text><text x="38" y="218" fill="#102645" font-size="18">A recent read succeeded.</text><text x="38" y="249" fill="#102645" font-size="18">Same value, same variant.</text><rect x="20" y="293" width="400" height="127" rx="8" fill="#f4f7fc"/><text x="38" y="324" fill="#244bd6" font-size="14" font-weight="700">02</text><text x="72" y="325" fill="#102645" font-size="21" font-weight="700">Confirmed change</text><text x="38" y="361" fill="#102645" font-size="18">Two comparable observations.</text><text x="38" y="392" fill="#102645" font-size="18">Check the source before acting.</text><rect x="20" y="436" width="400" height="127" rx="8" fill="#f4f7fc"/><text x="38" y="467" fill="#244bd6" font-size="14" font-weight="700">03</text><text x="72" y="468" fill="#102645" font-size="21" font-weight="700">Current state unknown</text><text x="38" y="504" fill="#102645" font-size="18">Collection failed.</text><text x="38" y="535" fill="#102645" font-size="18">Do not assume a stable price.</text></g></svg>