<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" role="img" aria-labelledby="t d"><title id="t">Du suivi à la décision</title><desc id="d">Sélectionner une page compatible, comparer, recevoir une alerte puis vérifier la source avant de décider.</desc><rect width="400" height="800" fill="#edf2f7"/><g font-family="Segoe UI, Arial, sans-serif"><text x="24" y="39" fill="#244bd6" font-size="14" letter-spacing="1">LE PARCOURS CHANGEWATCH</text><text x="24" y="75" fill="#102645" font-size="24" font-weight="600">Du suivi à la décision.</text><path d="M200 255v20M200 425v20M200 595v20" stroke="#244bd6" stroke-width="3"/><g fill="#fff" stroke="#c6d3e1"><rect x="24" y="105" width="352" height="150" rx="8"/><rect x="24" y="275" width="352" height="150" rx="8"/><rect x="24" y="445" width="352" height="150" rx="8"/></g><rect x="24" y="615" width="352" height="150" rx="8" fill="#102645"/><g fill="#244bd6" font-size="14" font-weight="600"><text x="44" y="133">01 / SÉLECTIONNER</text><text x="44" y="303">02 / COMPARER</text><text x="44" y="473">03 / RECEVOIR</text></g><g fill="#102645" font-size="21" font-weight="600"><text x="44" y="169">Une page compatible</text><text x="44" y="339">Des vérifications planifiées</text><text x="44" y="509">Une alerte email</text></g><g fill="#526175" font-size="16"><text x="44" y="201">Périmètre et extraction vérifiés</text><text x="44" y="226">à la configuration.</text><text x="44" y="371">Selon la fréquence du forfait,</text><text x="44" y="396">sans surveillance en temps réel.</text><text x="44" y="541">Lorsqu’un changement important</text><text x="44" y="566">est confirmé, avec sa source.</text></g><text x="44" y="643" fill="#b5f2ce" font-size="14" font-weight="600">04 / DÉCIDER</text><text x="44" y="679" fill="#fff" font-size="21" font-weight="600">Votre regard métier</text><text x="44" y="711" fill="#c5d6ea" font-size="16">Vérifier le contexte et choisir</text><text x="44" y="736" fill="#c5d6ea" font-size="16">la suite pertinente.</text></g></svg>
