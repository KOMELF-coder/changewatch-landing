<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">One price, three questions</title><desc id="desc">Fictional bag price drop from 99 to 79 euros. Check the variant, terms and delivery before deciding.</desc>
<rect width="960" height="500" fill="#102645"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="52" fill="#b5f2ce" font-size="16" letter-spacing="2">PUT THE PRICE IN CONTEXT</text><text x="48" y="87" fill="#c5d6ea" font-size="16">Fictional example · Atelier bag</text><rect x="48" y="123" width="330" height="325" rx="12" fill="#f5f8fb"/><path d="M177 215v-25c0-42 70-42 70 0v25" fill="none" stroke="#8da4bd" stroke-width="12"/><path d="M149 211h126l16 106H134Z" fill="#c4d4e4"/><text x="103" y="384" fill="#596b80" font-size="35">99 €</text><path d="M99 372h85" stroke="#596b80" stroke-width="2"/><text x="214" y="385" fill="#102645" font-size="46" font-weight="600">79 €</text><text x="116" y="423" fill="#244bd6" font-size="18">−€20 / approximately −20.2%</text><g fill="#fff" font-size="23"><text x="447" y="167">01 / Same variant?</text><text x="447" y="272">02 / Which conditions?</text><text x="447" y="377">03 / Total delivered cost?</text></g><g fill="#c5d6ea" font-size="19"><text x="447" y="201">Colour, size, quantity.</text><text x="447" y="306">Code, dates, eligibility.</text><text x="447" y="411">Fees and order threshold.</text></g><g stroke="#47617f"><path d="M447 231h455"/><path d="M447 336h455"/></g></g></svg>
