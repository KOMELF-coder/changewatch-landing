<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600"><rect width="440" height="600" rx="24" fill="#102645"/><g font-family="Arial,sans-serif"><text x="24" y="42" fill="#c8d7ff" font-size="15" font-weight="700">THREE DIFFERENT OUTPUTS</text><rect x="20" y="70" width="400" height="145" rx="14" fill="#f5f8ff"/><text x="38" y="98" fill="#2445b6" font-size="13" font-weight="700">01 / PAGE MONITORING</text><text x="38" y="131" fill="#102645" font-size="22" font-weight="700">A change to review</text><text x="38" y="161" fill="#33445c" font-size="16">Known compatible pages</text><text x="38" y="185" fill="#33445c" font-size="16">Email alerts, then human review</text><rect x="20" y="237" width="400" height="145" rx="14" fill="#f5f8ff"/><text x="38" y="265" fill="#2445b6" font-size="13" font-weight="700">02 / PRICE HISTORY</text><text x="38" y="298" fill="#102645" font-size="22" font-weight="700">Structured observations</text><text x="38" y="328" fill="#33445c" font-size="16">Matched products and variants</text><text x="38" y="352" fill="#33445c" font-size="16">Dated values for your analysis</text><rect x="20" y="404" width="400" height="145" rx="14" fill="#f5f8ff"/><text x="38" y="432" fill="#2445b6" font-size="13" font-weight="700">03 / REPRICING</text><text x="38" y="465" fill="#102645" font-size="22" font-weight="700">A controlled price update</text><text x="38" y="495" fill="#33445c" font-size="16">Rules, margin safeguards, approval</text><text x="38" y="519" fill="#33445c" font-size="16">A separate capability to verify</text></g></svg>