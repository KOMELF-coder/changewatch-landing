<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600"><rect width="440" height="600" rx="12" fill="#102645"/><g font-family="Arial,sans-serif"><text x="24" y="40" font-size="12" fill="#b5f2ce">FICTIONAL EXAMPLE / USD BEFORE TAX</text><text x="24" y="84" font-size="25" font-weight="700" fill="white">Shipping changes the ranking</text><rect x="20" y="115" width="400" height="157" rx="8" fill="#f3f6fb"/><text x="40" y="149" font-size="19" font-weight="700" fill="#102645">Retailer A</text><text x="40" y="188" font-size="18" fill="#102645">Listed $28 + shipping $8</text><text x="40" y="238" font-size="29" font-weight="700" fill="#244bd6">= $36</text><rect x="20" y="295" width="400" height="157" rx="8" fill="#f3f6fb"/><text x="40" y="329" font-size="19" font-weight="700" fill="#102645">Retailer B</text><text x="40" y="368" font-size="18" fill="#102645">Listed $32 + shipping $0</text><text x="40" y="418" font-size="29" font-weight="700" fill="#244bd6">= $32</text><text x="24" y="515" font-size="24" font-weight="700" fill="#b5f2ce">B costs $4 less before tax.</text><text x="24" y="553" font-size="17" fill="white">Same item. One-item order.</text></g></svg>